name: 照合

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fidelity:
    name: 紙面との照合 / 正誤表の監査 103 項目 / 参考文献と書棚 39 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf==6.19.0
      - run: python3 verification/check_fidelity.py -v
      - name: 正誤表が紙面からずれていないか（103 項目）
        run: python3 verification/check_errata.py
      - name: 参考文献の宣言と書棚（39 項目）
        run: python3 verification/check_references.py

  build:
    name: サイトが生成できるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - run: node build.js
      - name: 生成物と CSP
        run: node verification/check_site.js

  # ブラウザが要る検査は別の仕事にする。ブラウザの都合で落ちたのか、中身が壊れたのかを見分けるため。
  keyboard:
    name: キーボードで辿れるか・どの幅でも読めるか
    # ubuntu 26.04 では playwright 1.56.1 が Chromium を入れられない。cpsbvbng26-dotcom と同じく 24.04 に置く。
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node build.js
      - name: playwright と Chromium を入れる
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tab で辿り、五つの幅で測る
        run: NODE_PATH="$(npm root -g)" node verification/check_keyboard.js

name: 照合

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fidelity:
    name: Markdown が PDF と同じ語を並べているか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python3 verification/check_fidelity.py -v

  build:
    name: サイトが生成できるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - run: node build.js

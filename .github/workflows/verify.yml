name: 照合

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fidelity:
    name: 紙面との照合 / 正誤表の監査 90 項目 / 参考文献と書棚 27 項目
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pypdf
      - run: python3 verification/check_fidelity.py -v
      - name: 正誤表が紙面からずれていないか（90 項目）
        run: python3 verification/check_errata.py
      - name: 参考文献の宣言と書棚（27 項目）
        run: python3 verification/check_references.py

  build:
    name: サイトが生成できるか
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 誤変換とバッジ記法
        run: node verification/check_text.js
      - run: node build.js
      - name: 生成物と CSP
        run: node verification/check_site.js

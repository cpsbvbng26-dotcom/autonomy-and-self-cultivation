# 三篇の PDF に対する、正誤表の監査の宣言。
#
#     python3 verification/check_errata.py
#
# PDF は公開済みで、もう直せない。直せるのは ERRATA.md のほうである。
# ここに書いてあるのは「ERRATA.md が三篇からずれていないこと」の条件である。
#
# 道具は errata-check（MIT、v0.2.0、DOI: 10.5281/zenodo.22649899）。単一ファイルなので
# verification/errata_check.py に写して使っている。

root = ".."

[document]
path = "ERRATA.md"

[[source]]
id = "N"
path = "pdf/nobility-and-exemplarity-of-the-celibate-individual-v2.pdf"
sha256 = "fba3eb679eb247cbb6d51d9df203f7d6b84547bef68108d5ee2775560a8a28db"

[[source]]
id = "M"
path = "pdf/manifesto-of-imperial-selfhood-revised.pdf"
sha256 = "2d1d169954079fc4684e3505bce950a0120ccb838626545d7717e7c17b447541"

[[source]]
id = "F"
path = "pdf/fragmentarian-spiritual-individualism.pdf"
sha256 = "58dbe84b2be8fe7fe6a785419ca7223415dcb1c199764f9eaf65305d41b2bb71"

# ------------------------------------------------- E1 —— DOI が印字されていない
#
# 「印字されていない」ことの検査である。present = false で、無いことを確かめる。
# 一つでも紙面に現れたら落ちる。そのときは正誤表のほうが誤っている。

[[quote]]
source = "N"
where = "自身の DOI"
text = "10.5281/zenodo.22058254"
present = false

[[quote]]
source = "M"
where = "自身の DOI"
text = "10.5281/zenodo.22057583"
present = false

[[quote]]
source = "F"
where = "自身の DOI"
text = "10.5281/zenodo.22064241"
present = false

# doi.org へのリンクの形でも印字されていないこと

[[quote]]
source = "N"
where = "DOI の解決 URL"
text = "doi.org/10.5281"
present = false

[[quote]]
source = "M"
where = "DOI の解決 URL"
text = "doi.org/10.5281"
present = false

[[quote]]
source = "F"
where = "DOI の解決 URL"
text = "doi.org/10.5281"
present = false

# ---------------------------------------------- E2 —— ORCID が印字されていない

[[quote]]
source = "N"
where = "ORCID"
text = "0009-0000-1406-0547"
present = false

[[quote]]
source = "M"
where = "ORCID"
text = "0009-0000-1406-0547"
present = false

[[quote]]
source = "F"
where = "ORCID"
text = "0009-0000-1406-0547"
present = false

# 検査数字そのものは合っている。正誤表が挙げている ORCID が正しいことの確認。

[[identifier]]
kind = "orcid"
value = "0009-0000-1406-0547"

# --------------------------------- E3 —— 初版を指すが、その所在を示していない

[[count]]
source = "N"
group = "version"
expect = 1

[[quote]]
source = "N"
group = "version"
where = "表紙の改訂の注記"
text = "Original version: 21 October 2025 | Revised version (v2): 22 August 2026"

# ------------------------------------ E4 —— 表紙が挙げる頒布先（一つ欠けた）

[[count]]
source = "M"
group = "distribution"
expect = 1

# ------------------------------------- E7 —— 確かめられないことを断言している
#
# 開示文の中で、いちばん重い一文である。捏造が無かったことを確かめたのは AI で、
# 著者は原典に当たっていない（E6）。**AI 自身の報告以外に根拠が無い。**
# 二つとも紙面に印字されている。書き換えられたら、そこで落ちる。

[[quote]]
source = "M"
where = "E7 —— 捏造が無かったことの断言"
group = "e7"
text = "No data, quotations, or sources were fabricated by the AI system in the course of this revision."

[[quote]]
source = "M"
where = "E7 —— 照合したのは AI である"
group = "e7"
text = "verify the bibliographic citations listed in the References section against publicly available sources"

[[count]]
source = "M"
group = "e7"
expect = 2

# E7 は M だけの話である。N と F には無い。範囲を機械で固定しておく。

[[quote]]
source = "N"
where = "E7 の断言（N には無い）"
text = "No data, quotations, or sources were fabricated"
present = false

[[quote]]
source = "F"
where = "E7 の断言（F には無い）"
text = "No data, quotations, or sources were fabricated"
present = false

# ------------------------------- N5・N6 —— 紙面に現れない語
#
# 論証の構造に関わる語が、一度も出てこないこと。出てきたら、その時点で
# N5 と N6 を書き直す番である。

[[quote]]
source = "N"
where = "N5 —— 避妊への言及"
text = "contracept"
present = false

[[quote]]
source = "N"
where = "N6 —— アセクシュアリティへの言及"
text = "asexual"
present = false

[[quote]]
source = "N"
where = "N6 —— 非自発性への言及"
text = "involuntary"
present = false

[[quote]]
source = "M"
group = "distribution"
where = "表紙"
text = "Prepared for open-access distribution via Zenodo, Academia.edu, and ResearchGate."

# ---------------------------------- N2 —— 偽陽性を出した箇所は、実際にあること
#
# 私の照合が「参考文献欄に無い」と誤報した項目。**実際にはある。**
# ここで present = true にしておけば、同じ誤報を二度出せない。

[[quote]]
source = "M"
where = "参考文献（Nietzsche 1967）"
text = "Nietzsche, Friedrich. The Will to Power. Translated by Walter Kaufmann and R. J. Hollingdale. New York: Vintage, 1967."
in_document = true

[[quote]]
source = "M"
where = "本文の引用（Nietzsche 1967）"
text = "with expanded editions in 1906 and 1911 (Nietzsche 1967)"
in_document = false

# ------------------------------------------ N3 —— 査読前であることの明示

[[quote]]
source = "N"
where = "表紙"
text = "Preprint. Not peer-reviewed."
in_document = false

[[quote]]
source = "F"
where = "表紙"
text = "Preprint. This work has not been peer reviewed."
in_document = false

# ------------------------------------------------ N4 —— AI の使用の開示

[[quote]]
source = "N"
where = "AI 開示"
text = "The author reviewed, revised, and takes full intellectual responsibility for all claims, arguments, and citations herein."
in_document = false

[[quote]]
source = "M"
where = "AI 開示"
text = "The author's original draft set out the core proposal"
in_document = false

[[quote]]
source = "F"
where = "AI 開示"
text = "AI Use Disclosure Statement"
in_document = false

# ------------------------------------------------------------ 未解決の項目

[[open_item]]
id = "E1"
heading_pattern = "^## E1 —"
must_say = ["この項目は解決しない", "10.5281/zenodo.22058254"]
must_not_say = ["解決済み"]

[[open_item]]
id = "E2"
heading_pattern = "^## E2 —"
must_say = ["この項目は解決しない"]

[[open_item]]
id = "E3"
heading_pattern = "^## E3 —"
must_say = ["この項目は解決しない"]

[[open_item]]
id = "E4"
heading_pattern = "^## E4 —"
must_say = ["この項目は解決しない", "無い"]
must_not_say = ["まだ確かめていません"]

# ------------------------------- E5 —— 開示文が挙げている作業（翻訳は無い）
#
# 三篇とも AI の使用を開示し、何をさせたかを列挙している。その列挙に
# 「翻訳」が無いことが E5 である。列挙のほうを紙面から取って固定しておく。

[[quote]]
source = "F"
group = "ai_disclosure"
where = "断章論の AI 開示"
text = "expanding the author’s original conceptual outline into full prose"

[[quote]]
source = "N"
group = "ai_disclosure"
where = "独身論の AI 開示"
text = "expand and copyedit the prose of the original manuscript"

[[quote]]
source = "M"
group = "ai_disclosure"
where = "M の AI 開示"
text = "expand the exposition of each philosophical source with additional textual and historical detail"

# 「翻訳」という語が、どの開示文にも無いこと。ここが E5 の中身である。
# 参考文献の側では translation が出てくるので、開示文の言い回しで狙い撃つ。

[[quote]]
source = "F"
where = "断章論の AI 開示"
text = "translated from Japanese"
present = false

[[quote]]
source = "N"
where = "独身論の AI 開示"
text = "translated from Japanese"
present = false

[[quote]]
source = "M"
where = "M の AI 開示"
text = "translated from Japanese"
present = false

# ------------------------- E6 —— 引用について AI に何をさせたかの書き分け
#
# 二本は引用の割り当てを開示しているが、断章論だけ狭い。三本とも
# 「著者は原典に当たっていない」とは述べていない。紙面から取って固定する。

[[quote]]
source = "N"
group = "citation_disclosure"
where = "独身論の AI 開示（引用の割り当て）"
text = "situate the paper's claims within existing philosophical literature"

[[quote]]
source = "M"
group = "citation_disclosure"
where = "M の AI 開示（引用の割り当て）"
text = "identify and verify the bibliographic citations listed in the References section"

[[quote]]
source = "F"
group = "citation_disclosure"
where = "断章論の AI 開示（狭い書き方）"
text = "checking selected bibliographic details for accuracy"

# 「原典に当たっていない」に相当する記述は、どの紙面にも無い。

[[quote]]
source = "N"
where = "独身論"
text = "the author has not consulted"
present = false

[[quote]]
source = "M"
where = "M"
text = "the author has not consulted"
present = false

[[quote]]
source = "F"
where = "断章論"
text = "the author has not consulted"
present = false

[[open_item]]
id = "E6"
heading_pattern = "^## E6 —"
must_say = ["この項目は解決しない", "当たっていない", "捏造ではない", "剽窃ではない"]

[[open_item]]
id = "E5"
heading_pattern = "^## E5 —"
must_say = ["この項目は解決しない", "特定できない", "違反していない"]

[[open_item]]
id = "N2"
heading_pattern = "^### N2 —"
must_say = ["検査の側の誤りである"]

# N7 —— 読者が影響を認めたことを、典拠が支持している根拠にしない。
# **この区別が消えると、読まずに一致を主張したことになる。**
# 「原典を読んだ」と書き換わったら落ちるようにしておく。

[[open_item]]
id = "N7"
heading_pattern = "^### N7 —"
must_say = ["紙面についての事実であって、典拠についての事実ではない",
            "いずれも原典を読んでいない"]
must_not_say = ["原典を読んだ", "読者が認めたのだから"]

[dates]
stamp_pattern = "最終更新: (\\d{4})年(\\d{1,2})月(\\d{1,2})日"
any_pattern = "(\\d{4})年(\\d{1,2})月(\\d{1,2})日"

# ------------------------------- CI の題が名乗る参考文献の検査の件数
#
# **散文に数を書いたら、その数を機械で確かめられるようにする。**
# 正誤表の側の件数は check_errata.py が自分で数えている（自分自身を含むため、
# ここからは呼べない）。こちらは別のスクリプトなので呼べる。

[[number]]
label = "参考文献と書棚の検査の件数"
command = "python3 verification/check_references.py"
extract = "(\\d+) 件すべて通りました"
pattern = "書棚[^\\n]*?(\\d+) 項目"
in = [".github/workflows/verify.yml"]

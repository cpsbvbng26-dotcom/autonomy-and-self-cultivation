# 三篇の参考文献欄に載っている典拠を、一つずつ並べたもの。
#
#     python3 verification/check_references.py
#
# **いまは全部が空欄である。**それが正しい初期状態である。
#
# ERRATA の E6 に書いたとおり、著者はこれらの原典に当たっていない。だから
# 「どの箇所が、どの主張を支えているか」を、いまは誰も書けない。**書けないもの
# を埋めるより、空欄のまま数えられるようにするほうを選んだ。**
#
# 「読んだ」という欄は置かない。**内面は外から確かめられない**からである。
# 置くのは locus（どの箇所か）と supports（何を支えているか）で、これは公開
# された主張であり、**その本を持っている人なら誰でも反証できる。**
#
# 埋めるときの決まり:
#
#   locus     節・章・断章番号・頁。「その本のどこか」は認めない
#   supports  その箇所が支えている、本文のどの主張か
#   role      直接支持 / 用語の出所 / 対立見解 / 背景 / 反例 の五つだけ。
#             一つの典拠が二つの役を兼ねることはある。そのときは「・」で並べる
#   agreement 一致 / 部分一致 / 不一致 の三つだけ。空欄は未検証を意味する
#   caveat    版や編纂の事情など、読者が知るべき留保（任意）
#   origin    自前 / 外から の二つだけ。空欄は未記載を意味する（任意）
#
# **agreement を分けて置く理由。**「原典に当たっていない」は手続きについての記述で
# あって、引用が誤っていることを意味しない。三つに分かれる。
#
#   一致    典拠が実際にその主張を述べている。**読んでいなくても当たっていた**
#   不一致  典拠はそう述べていない。**未読が実害になっている**
#   未検証  どちらか分からない。件数は check_references.py が数える
#
# **一致だった場合、それは Trinity-Infinity 側で「再発見」と呼んだ形と同じである。**
# あちらの README は、独立に標準形へ着地したこと自体が、直観が実在する構造を
# 捉えていた証拠になると書いている。**同じ基準を哲学の側にも当てる。**
#
# **ただし読んでからしか言えない。**いま一致だと書けば、読まずに内容を主張したこと
# になり、E6 を繰り返す。だから欄を作って空にしておく。
#
# **役を兼ねる場合。**用語の出所であり、同時に直接支持でもある、という典拠はある。
# そのときは「・」で並べる。並べられるのは上の五つだけで、同じ語は二度書けない。
#
# **兼ねる理由が、典拠についての観察でないことがある。**外部の読者が影響を認めた、
# というのは紙面についての観察である。典拠がその主張を述べているかは、そこからは
# 出ない。だから role は兼ねても、agreement は空欄のままになる（ERRATA の N7）。
#
# **origin を分けて置く理由。**未読であることの重さは、典拠ごとに違う。二つに分かれる。
#
#   自前    論文の着想が先にあり、典拠は後から結び付けた
#   外から  典拠が着想を供給した。論文の側に先に無かった
#
# 自前の場合、引用が外れていても主張そのものは残る。失われるのは支えだけである。
# **外から来ていて、なお読んでいない場合は、主張そのものが人伝えの要約に乗っている。**
# これが E6 のいちばん深いところである。件数は check_references.py が数える。
#
# **自前にも自前の危うさがある。**着想に合う典拠を後から探して貼ったのなら、
# 典拠が実際には違うことを述べている可能性を、着想への確信が隠す。
# 自前は、確認の代わりにはならない。
#
# 皇帝主義では、目的の王国（カント）と意味の帝国（ニーチェ）は着想の側が先にあった。
# 総動員（ユンガー）は後から来た。**この差は利用者の証言であり、紙面からは出ない。**
#
# **埋めた日は git が持つ。**あとから遡って埋めたことにはできない。
#
# 書式は errata-check の [[reference]] と同じである。
# https://github.com/cpsbvbng26-dotcom/errata-check

# 参考文献欄にあって、本文からは引かれていない項目。
#
# **宣言しておく。**新しく増えたら check_references.py が落ちる。
# 増えたときに気づかないほうが、載っていること自体より悪い。
#
# 探索語は id の真ん中から取る。取れないもの（ウムラウトや書名だけの項目）は
# body_key を書く。**Jünger を junger で探して見落とした。**

